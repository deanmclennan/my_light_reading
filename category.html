<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category - My Light Reading</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Honk&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --bg-secondary: #f5f5f5;
      --text: #1a1a1a;
      --text-muted: #666666;
      --border: #e0e0e0;
      --accent: #0066cc;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;
        --bg-secondary: #2a2a2a;
        --text: #e0e0e0;
        --text-muted: #999999;
        --border: #404040;
        --accent: #4d9fff;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem;
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-text {
      font-family: "Honk", system-ui;
      font-size: 2.5rem;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .category-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    .category-count {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .search-box {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-secondary);
      color: var(--text);
      outline: none;
      margin-bottom: 1.5rem;
    }

    .search-box:focus {
      border-color: var(--accent);
    }

    .search-box::placeholder {
      color: var(--text-muted);
    }

    .links {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem 1.5rem;
    }

    .link:nth-child(even) {
      border-left: 2px dotted var(--border);
      padding-left: 1rem;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.625rem 0.75rem;
      text-decoration: none;
      color: var(--text);
      border-radius: 6px;
      transition: background 0.15s;
    }

    .link:hover {
      background: var(--bg-secondary);
    }

    .link-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .link-title {
      font-weight: 500;
    }

    .link-url {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-left: auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 200px;
    }

    .no-results {
      text-align: center;
      color: var(--text-muted);
      padding: 3rem 1rem;
    }

    .subcategory {
      margin-top: 2rem;
    }

    .subcategory-header {
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .subcat-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .subcat-pill {
      display: inline-flex;
      align-items: center;
      padding: 0.375rem 0.75rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 1rem;
      text-decoration: none;
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .subcat-pill:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .subcat-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .nested-section {
      margin-top: 1rem;
    }

    .nested-header {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .category-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .category-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 2rem;
      text-decoration: none;
      color: var(--text);
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.15s;
    }

    .category-pill:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .category-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    @media (max-width: 768px) {
      body {
        padding: 1rem;
      }

      .links {
        grid-template-columns: 1fr;
      }

      .link:nth-child(even) {
        border-left: none;
        padding-left: 0.75rem;
      }

      .link-url {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to all categories</a>
    <h1><span class="logo-text">My Light Reading</span></h1>
    <nav class="category-nav" id="category-nav"></nav>
  </header>
  <main>
    <h2 class="category-title" id="category-title">Loading...</h2>
    <p class="category-count" id="category-count"></p>
    <input type="text" class="search-box" placeholder="Search in this category..." id="search" autocomplete="off">
    <div id="content"></div>
  </main>

  <script>
    let categoryData = null;
    let allCategories = [];
    let currentSlug = '';
    let activeNestedSubs = {}; // Track active sub-subcategory per subcategory

    function slugify(text) {
      return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    }

    function renderCategoryNav() {
      const nav = document.getElementById('category-nav');
      nav.innerHTML = allCategories.map(cat => {
        const slug = slugify(cat.name);
        const isActive = slug === currentSlug;
        return `<a href="category.html?cat=${slug}" class="category-pill${isActive ? ' active' : ''}">
          ${cat.name}
        </a>`;
      }).join('');
    }

    function getDomain(url) {
      try {
        return new URL(url).hostname;
      } catch {
        return '';
      }
    }

    function getFaviconUrl(url) {
      const domain = getDomain(url);
      return `https://www.google.com/s2/favicons?domain=${domain}&sz=32`;
    }

    function filterLinks(links, query) {
      if (!query) return links;
      return links.filter(link =>
        link.title.toLowerCase().includes(query) ||
        link.url.toLowerCase().includes(query)
      );
    }

    function renderLinkList(links) {
      return links.map(link => {
        const domain = getDomain(link.url);
        return `<a href="${link.url}" class="link" target="_blank" rel="noopener">
          <img src="${getFaviconUrl(link.url)}" alt="" class="link-icon" loading="lazy">
          <span class="link-title">${link.title}</span>
          <span class="link-url">${domain}</span>
        </a>`;
      }).join('');
    }

    function setActiveNestedSub(subSlug, nestedSlug) {
      activeNestedSubs[subSlug] = nestedSlug;
      renderLinks(document.getElementById('search').value);
    }

    function renderNestedSubcategory(sub, query) {
      const subSlug = slugify(sub.name);
      const activeNested = activeNestedSubs[subSlug] || 'all';

      // Build pills for nested subcategories
      let pillsHtml = `<div class="subcat-nav">
        <span class="subcat-pill${activeNested === 'all' ? ' active' : ''}"
              onclick="setActiveNestedSub('${subSlug}', 'all')">All</span>`;

      for (const nested of sub.subcategories) {
        const nestedSlug = slugify(nested.name);
        pillsHtml += `<span class="subcat-pill${activeNested === nestedSlug ? ' active' : ''}"
              onclick="setActiveNestedSub('${subSlug}', '${nestedSlug}')">${nested.name}</span>`;
      }
      pillsHtml += `</div>`;

      // Build links based on active selection
      let linksHtml = '';
      let count = 0;

      if (activeNested === 'all') {
        // Show all nested subcategories with headers
        for (const nested of sub.subcategories) {
          const nestedLinks = filterLinks(nested.links || [], query);
          if (nestedLinks.length > 0) {
            count += nestedLinks.length;
            linksHtml += `<div class="nested-section">
              <h4 class="nested-header">${nested.name}</h4>
              <div class="links">${renderLinkList(nestedLinks)}</div>
            </div>`;
          }
        }
      } else {
        // Show only selected nested subcategory
        const selected = sub.subcategories.find(n => slugify(n.name) === activeNested);
        if (selected) {
          const nestedLinks = filterLinks(selected.links || [], query);
          count = nestedLinks.length;
          if (nestedLinks.length > 0) {
            linksHtml = `<div class="links">${renderLinkList(nestedLinks)}</div>`;
          }
        }
      }

      return { html: pillsHtml + linksHtml, count };
    }

    function renderLinks(filter = '') {
      const content = document.getElementById('content');
      const query = filter.toLowerCase().trim();

      if (!categoryData) {
        content.innerHTML = `<div class="no-results">Category not found</div>`;
        return;
      }

      let html = '';
      let totalResults = 0;

      // Render main category links
      const mainLinks = filterLinks(categoryData.links || [], query);
      if (mainLinks.length > 0) {
        totalResults += mainLinks.length;
        html += `<div class="links">${renderLinkList(mainLinks)}</div>`;
      }

      // Render subcategories
      if (categoryData.subcategories) {
        for (const sub of categoryData.subcategories) {
          // Check if this subcategory has nested subcategories
          if (sub.subcategories && sub.subcategories.length > 0) {
            const { html: nestedHtml, count } = renderNestedSubcategory(sub, query);
            if (count > 0 || !query) {
              totalResults += count;
              html += `<div class="subcategory">
                <h3 class="subcategory-header">${sub.name}</h3>
                ${nestedHtml}
              </div>`;
            }
          } else {
            // Regular subcategory with just links
            const subLinks = filterLinks(sub.links || [], query);
            if (subLinks.length > 0) {
              totalResults += subLinks.length;
              html += `<div class="subcategory">
                <h3 class="subcategory-header">${sub.name}</h3>
                <div class="links">${renderLinkList(subLinks)}</div>
              </div>`;
            }
          }
        }
      }

      if (totalResults === 0) {
        html = `<div class="no-results">No links found</div>`;
      }

      content.innerHTML = html;
    }

    function getTotalLinkCount() {
      let count = (categoryData.links || []).length;
      if (categoryData.subcategories) {
        for (const sub of categoryData.subcategories) {
          if (sub.subcategories) {
            for (const nested of sub.subcategories) {
              count += (nested.links || []).length;
            }
          } else {
            count += (sub.links || []).length;
          }
        }
      }
      return count;
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      currentSlug = params.get('cat');

      if (!currentSlug) {
        window.location.href = 'index.html';
        return;
      }

      try {
        const response = await fetch('links.json');
        const data = await response.json();

        allCategories = data.categories || [];
        categoryData = allCategories.find(c => slugify(c.name) === currentSlug);

        renderCategoryNav();

        if (!categoryData) {
          document.getElementById('category-title').textContent = 'Category not found';
          document.getElementById('content').innerHTML =
            `<div class="no-results">This category doesn't exist. <a href="index.html">Go back</a></div>`;
          return;
        }

        document.title = `${categoryData.name} - My Light Reading`;
        document.getElementById('category-title').textContent = categoryData.name;
        document.getElementById('category-count').textContent = `${getTotalLinkCount()} links`;

        renderLinks();
      } catch (error) {
        document.getElementById('content').innerHTML =
          `<div class="no-results">Failed to load links</div>`;
      }

      document.getElementById('search').addEventListener('input', (e) => {
        renderLinks(e.target.value);
      });
    }

    init();
  </script>
</body>
</html>
