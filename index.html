<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Light Reading - Curated Link Directory for Tech, Science, Finance & More</title>
  <meta name="description" content="A curated directory of the best websites and resources across tech, science, finance, health, gaming, aviation, and more. Find quality sources for your daily reading.">
  <meta name="keywords" content="link directory, curated links, tech news, science news, finance resources, developer tools, gaming news, aviation news, health resources">
  <meta name="author" content="My Light Reading">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://mylightreading.com/">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mylightreading.com/">
  <meta property="og:title" content="My Light Reading - Curated Link Directory">
  <meta property="og:description" content="A curated directory of the best websites and resources across tech, science, finance, health, gaming, aviation, and more.">
  <meta property="og:site_name" content="My Light Reading">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://mylightreading.com/">
  <meta name="twitter:title" content="My Light Reading - Curated Link Directory">
  <meta name="twitter:description" content="A curated directory of the best websites and resources across tech, science, finance, health, gaming, aviation, and more.">

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "My Light Reading",
    "description": "A curated directory of the best websites and resources across tech, science, finance, health, gaming, aviation, and more.",
    "url": "https://mylightreading.com/",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://mylightreading.com/?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Honk&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --bg-secondary: #f5f5f5;
      --text: #1a1a1a;
      --text-muted: #666666;
      --border: #e0e0e0;
      --accent: #0066cc;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1a1a1a;
        --bg-secondary: #2a2a2a;
        --text: #e0e0e0;
        --text-muted: #999999;
        --border: #404040;
        --accent: #4d9fff;
      }
    }

    :root[data-theme="dark"] {
      --bg: #1a1a1a;
      --bg-secondary: #2a2a2a;
      --text: #e0e0e0;
      --text-muted: #999999;
      --border: #404040;
      --accent: #4d9fff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .theme-toggle {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 2rem;
      padding: 0.5rem 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text);
      font-size: 0.875rem;
      transition: all 0.15s;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .theme-toggle i {
      font-size: 1rem;
    }

    .logo-text {
      font-family: "Honk", system-ui;
      font-size: 2.5rem;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .search-box {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-secondary);
      color: var(--text);
      outline: none;
      margin-bottom: 1rem;
    }

    .search-box:focus {
      border-color: var(--accent);
    }

    .search-box::placeholder {
      color: var(--text-muted);
    }

    .category-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .category-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 2rem;
      text-decoration: none;
      color: var(--text);
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.15s;
    }

    .category-pill:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .category-pill i {
      font-size: 0.75rem;
      opacity: 0.7;
    }

    .category {
      margin-bottom: 2.5rem;
    }

    .category-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .category-header a {
      font-size: 0.75rem;
      color: var(--accent);
      text-decoration: none;
      text-transform: none;
      font-weight: 500;
    }

    .category-header a:hover {
      text-decoration: underline;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem 1.5rem;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.625rem 0.75rem;
      text-decoration: none;
      color: var(--text);
      border-radius: 6px;
      transition: background 0.15s;
    }

    .link:nth-child(even) {
      border-left: 2px dotted var(--border);
      padding-left: 1rem;
    }

    .link:hover {
      background: var(--bg-secondary);
    }

    .link-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .link-title {
      font-weight: 500;
    }

    .link-url {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-left: auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 200px;
    }

    .no-results {
      text-align: center;
      color: var(--text-muted);
      padding: 3rem 1rem;
    }

    footer {
      margin-top: 3rem;
      padding: 2rem 0;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    footer p {
      margin-bottom: 0.5rem;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 1rem;
    }

    @media (max-width: 768px) {
      body {
        padding: 1rem;
      }

      .links {
        grid-template-columns: 1fr;
      }

      .link:nth-child(even) {
        border-left: none;
        padding-left: 0.75rem;
      }

      .link-url {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-row">
      <h1><span class="logo-text">My Light Reading</span></h1>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
        <i class="fa-solid fa-moon"></i>
        <span>Dark</span>
      </button>
    </div>
    <input type="text" class="search-box" placeholder="Search articles..." id="search" autocomplete="off">
    <nav class="category-nav" id="category-nav"></nav>
  </header>
  <main id="content">
    <div class="no-results">Loading...</div>
  </main>

  <footer>
    <p><strong>My Light Reading</strong> — A curated directory of quality links across tech, science, finance, and more.</p>
    <p>Hand-picked resources to help you stay informed without the noise.</p>
    <div class="footer-links">
      <a href="https://linkedin.com/in/deanmclennan" target="_blank" rel="noopener"><i class="fa-brands fa-linkedin"></i> Dean McLennan</a>
    </div>
  </footer>

  <script>
    // Theme toggle
    function initTheme() {
      const saved = localStorage.getItem('theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      }
      updateToggleButton();
    }

    function updateToggleButton() {
      const btn = document.getElementById('theme-toggle');
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark' ||
        (!document.documentElement.getAttribute('data-theme') &&
         window.matchMedia('(prefers-color-scheme: dark)').matches);

      btn.innerHTML = isDark
        ? '<i class="fa-solid fa-sun"></i><span>Light</span>'
        : '<i class="fa-solid fa-moon"></i><span>Dark</span>';
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

      let newTheme;
      if (current === 'dark') {
        newTheme = 'light';
      } else if (current === 'light') {
        newTheme = 'dark';
      } else {
        newTheme = prefersDark ? 'light' : 'dark';
      }

      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateToggleButton();
    }

    document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
    initTheme();

    let linksData = [];
    const LINKS_PER_CATEGORY = 6;

    function slugify(text) {
      return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    }

    function getDomain(url) {
      try {
        return new URL(url).hostname.replace('www.', '');
      } catch {
        return '';
      }
    }

    function getFaviconUrl(url) {
      const domain = getDomain(url);
      return `https://www.google.com/s2/favicons?domain=${domain}&sz=32`;
    }

    function renderCategoryNav() {
      const nav = document.getElementById('category-nav');
      const categories = linksData.categories || [];

      nav.innerHTML = categories.map(cat =>
        `<a href="category.html?cat=${slugify(cat.name)}" class="category-pill">
          ${cat.name}
          <i class="fa-solid fa-arrow-right"></i>
        </a>`
      ).join('');
    }

    function getAllLinks(category) {
      let links = [...(category.links || [])];
      if (category.subcategories) {
        for (const sub of category.subcategories) {
          if (sub.subcategories) {
            for (const nested of sub.subcategories) {
              links = links.concat(nested.links || []);
            }
          } else {
            links = links.concat(sub.links || []);
          }
        }
      }
      return links;
    }

    function getTotalLinkCount(category) {
      return getAllLinks(category).length;
    }

    function renderCategories() {
      const content = document.getElementById('content');
      let html = '';

      for (const category of linksData.categories || []) {
        const slug = slugify(category.name);
        const totalCount = getTotalLinkCount(category);
        const links = (category.links || []).slice(0, LINKS_PER_CATEGORY);

        html += `<section class="category" id="cat-${slug}">
          <h2 class="category-header">
            ${category.name}
            <a href="category.html?cat=${slug}">View all ${totalCount} sources →</a>
          </h2>
          <div class="links">
            ${links.map(link => `
              <a href="${link.url}" class="link" target="_blank" rel="noopener">
                <img src="${getFaviconUrl(link.url)}" alt="" class="link-icon" loading="lazy">
                <span class="link-title">${link.title}</span>
                <span class="link-url">${getDomain(link.url)}</span>
              </a>
            `).join('')}
          </div>
        </section>`;
      }

      content.innerHTML = html;
    }

    async function init() {
      try {
        const response = await fetch('links.json');
        linksData = await response.json();
        renderCategoryNav();
        renderCategories();
      } catch (error) {
        document.getElementById('content').innerHTML =
          `<div class="no-results">Failed to load content</div>`;
      }

      // Simple search - filters visible links
      document.getElementById('search').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        document.querySelectorAll('.link').forEach(link => {
          const title = link.querySelector('.link-title').textContent.toLowerCase();
          const url = link.querySelector('.link-url').textContent.toLowerCase();
          const match = !query || title.includes(query) || url.includes(query);
          link.style.display = match ? '' : 'none';
        });
      });
    }

    init();
  </script>
</body>
</html>
